# Lsearch 配置文件（lsearchd 首次运行自动生成）
# 索引根路径，逗号分隔。默认仅用户家目录，可按需追加，例如：
#   paths = /home/user,/data
paths = /home/code/Lsearch/.mgr2/home

# 排除的路径前缀，逗号分隔（命中即跳过，含其下所有内容）
excludes = /proc,/sys,/dev,/run,/snap,/home/code/Lsearch/.mgr2/home/.cache,/home/code/Lsearch/.mgr2/home/.local/share/Trash

# 是否索引以 . 开头的隐藏文件/目录（0/1）
index_hidden = 0

# 是否跟随符号链接（0/1；跟随可避免循环，但不跟随更安全）
follow_symlinks = 0
